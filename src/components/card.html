<!doctype html>
<div
  class="card"
  data-qa="card"
>
  <img
    class="card__image"
    src="https://via.placeholder.com/160x134"
    alt="APPLE A1419 iMac 27 Retina 5K"
  />

  <h2 class="card__title">
    APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
  </h2>

  <p class="card__code">Product code: 195434</p>

  <div class="card__reviews">
    <div class="stars stars--4">
      <div class="stars__stars"></div>
      <div class="stars__stars"></div>
      <div class="stars__stars"></div>
      <div class="stars__stars"></div>
      <div class="stars__stars"></div>
    </div>

    <span class="card__reviews-count">Reviews: 5</span>
  </div>

  <div class="card__price">
    <span class="card__price-label">Price:</span>
    <span class="card__price-value">$2,199</span>
  </div>

  <a
    class="card__buy"
    href="#"
    data-qa="hover"
  >
    BUY
  </a>
</div>
